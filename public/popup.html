<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSMod Info</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        width: 320px;
        margin: 0;
        padding: 16px;
        background-color: #09090b;
        color: #fafafa;
      }
      h1 {
        margin: 0 0 16px 0;
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }
      h1 img {
        height: 36px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        background-color: #ffffff;
        padding: 4px;
        border-radius: 6px;
      }
      p {
        font-size: 0.875rem;
        color: #a1a1aa;
        margin: 0 0 16px 0;
        line-height: 1.4;
      }
      .shortcut-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .shortcut-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background-color: #18181b;
        border: 1px solid #27272a;
        border-radius: 6px;
        font-size: 0.875rem;
      }
      .kbd {
        background-color: #27272a;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        padding: 2px 6px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        color: #e4e4e7;
      }
    </style>
  </head>
  <body>
    <h1>
      <img
        src="icon2.png"
        alt="FSMod Logo"
        onerror="this.style.display = 'none'"
      />
    </h1>
    <p>
      Modernize Chrome's native file:// directory listing with an aesthetic
      React UI.
    </p>

    <div class="shortcut-list">
      <div class="shortcut-item">
        <span>Open Folder/File</span>
        <span class="kbd">Click</span>
      </div>
      <div class="shortcut-item">
        <span>Preview File</span>
        <span
          ><span class="kbd">Shift</span> + <span class="kbd">Click</span></span
        >
      </div>
      <div class="shortcut-item">
        <span>Open in New Tab</span>
        <span
          ><span class="kbd">Ctrl</span> + <span class="kbd">Click</span></span
        >
      </div>
      <div class="shortcut-item">
        <span>Toggle Preview Lock</span>
        <span><span class="kbd">Shift</span> + <span class="kbd">P</span></span>
      </div>
    </div>
  </body>
</html>
